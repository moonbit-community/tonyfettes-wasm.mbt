name: Toolchain health
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        version: [latest, nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.version }}
      - run: moon version --all
      - run: moon update
      - run: moon check --deny-warn --target wasm,wasm-gc,js
      - run: moon fmt --check
      - run: moon info --target wasm,wasm-gc,js && git diff --exit-code
      - run: moon test --target wasm,wasm-gc,js
      - run: moon test --target wasm,wasm-gc,js --release
